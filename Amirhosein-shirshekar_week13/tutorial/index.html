<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabs Component with React</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      background: #1565c0;
      color: #fff;
      min-height: 100vh;
    }
    header { background: #2196f3; padding: 16px 24px 0; }
    h1 { margin: 0 0 24px; font-size: 24px; font-weight: 400; }
    .tabs { display: flex; gap: 8px; }
    .tab {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font: inherit;
      font-size: 14px;
      text-transform: uppercase;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .tab:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .tab.active { color: #ffeb3b; border-bottom-color: #ffeb3b; }
    .content { padding: 24px; animation: fade 0.3s ease; }
    .content h2 { margin: 0 0 12px; font-size: 20px; font-weight: 400; }
    .content p { margin: 0; line-height: 1.7; max-width: 800px; }
    .error { padding: 24px; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React (اگر یک منبع باز نشد، منبع بعدی امتحان می‌شود) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script>window.React || document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>')</script>
  <script>window.React || document.write('<script src="./node_modules/react/umd/react.production.min.js"><\/script>')</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.ReactDOM || document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>')</script>
  <script>window.ReactDOM || document.write('<script src="./node_modules/react-dom/umd/react-dom.production.min.js"><\/script>')</script>

  <script>
    (function () {
      var root = document.getElementById("root");

      if (!window.React || !window.ReactDOM) {
        root.innerHTML =
          '<div class="error">React could not be loaded. Check your internet connection (or VPN) and refresh.</div>';
        return;
      }

      var h = React.createElement;
      var useState = React.useState;
      var useEffect = React.useEffect;

      var LOREM =
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla venenatis ante augue. Phasellus volutpat neque ac dui mattis vulputate. Etiam consequat aliquam cursus. In sodales pretium ultrices. Maecenas lectus est, sollicitudin consectetur felis nec, feugiat ultricies mi.";

      var TABS = [1, 2, 3, 4].map(function (n) {
        return { id: n, title: "Tab " + n, heading: "Content " + n, text: LOREM };
      });

      var STORAGE_KEY = "lastActiveTab";

      function getInitialTab() {
        try {
          var saved = Number(localStorage.getItem(STORAGE_KEY));
          if (TABS.some(function (t) { return t.id === saved; })) return saved;
        } catch (e) {}
        return TABS[0].id;
      }

      function Tabs(props) {
        var tabs = props.tabs;
        var state = useState(getInitialTab);
        var activeId = state[0];
        var setActiveId = state[1];

        useEffect(function () {
          try { localStorage.setItem(STORAGE_KEY, String(activeId)); } catch (e) {}
        }, [activeId]);

        var active = tabs.find(function (t) { return t.id === activeId; });

        return h(
          React.Fragment,
          null,
          h(
            "header",
            null,
            h("h1", null, "Tabs Component with React"),
            h(
              "nav",
              { className: "tabs" },
              tabs.map(function (t) {
                return h(
                  "button",
                  {
                    key: t.id,
                    className: "tab" + (t.id === activeId ? " active" : ""),
                    onClick: function () { setActiveId(t.id); }
                  },
                  t.title
                );
              })
            )
          ),
          h(
            "main",
            { className: "content", key: active.id },
            h("h2", null, active.heading),
            h("p", null, active.text)
          )
        );
      }

      ReactDOM.createRoot(root).render(h(Tabs, { tabs: TABS }));
    })();
  </script>
</body>
</html>
